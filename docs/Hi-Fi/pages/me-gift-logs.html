<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赠金记录 · 六六弗尔豪斯</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="screen-body">
  <div class="screen-root">
    <div class="statusbar"><span>9:41</span><span>●●● 5G 100%</span></div>
    <div class="navbar"><a class="back" href="me-index.html">‹</a><span class="navbar-title">赠金记录</span></div>

    <div class="content">
      <div class="card-gold">
        <div class="sub">当前有效赠金（未过期批次合计）</div>
        <div class="title accent" style="font-size:28px;margin:6px 0;">¥50.00</div>
        <div class="sub">¥30.00 将于 2026-09-01 过期</div>
      </div>

      <div class="card-gold">
        <div class="title" style="font-size:14px;margin-bottom:8px;">赠金说明：</div>
        <div class="sub" style="line-height:22px;">a.存记分牌的同时获得赠金</div>
        <div class="sub" style="line-height:22px;">b.记分牌:赠金=300:1</div>
        <div class="sub" style="line-height:22px;">c.赠金仅限兑换店内酒水、小吃等</div>
        <div class="sub" style="line-height:22px;">d.赠金仅限店内使用，不可转增、不可交易、不可折现</div>
      </div>

      <div class="title" style="font-size:14px;font-weight:700;margin:4px 0 10px;">赠金明细：</div>

      <div class="card">
        <div style="padding:14px 0;border-bottom:1px solid var(--line);">
          <div class="row-between"><div class="flex-1">充值赠送</div><div class="tag">有效</div></div>
          <div class="row-between" style="margin:8px 0;"><div class="sub">发放 ¥200.00 · 剩余 ¥30.00</div><div class="sub">2026-09-01 到期</div></div>
          <div class="sub">2026-06-03 20:11</div>
        </div>
        <div style="padding:14px 0;">
          <div class="row-between"><div class="flex-1">记分牌兑换</div><div class="tag gray">已用完</div></div>
          <div class="row-between" style="margin:8px 0;"><div class="sub">发放 ¥100.00 · 剩余 ¥0.00</div><div class="sub">永久有效</div></div>
          <div class="sub">2026-08-17 16:21</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
