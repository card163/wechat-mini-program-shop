<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>记分牌兑换 · 六六弗尔豪斯</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="screen-body">
  <div class="screen-root">
    <div class="statusbar"><span>9:41</span><span>●●● 5G 100%</span></div>
    <div class="navbar"><a class="back" href="me-index.html">‹</a><span class="navbar-title">记分牌兑换</span></div>

    <div class="content">
      <div class="card row-between">
        <div>
          <div class="sub">我的记分牌</div>
          <div class="title accent" style="font-size:26px;margin-top:4px;">1200</div>
          <div class="sub">记分牌 : 赠金 = 300 : 1</div>
        </div>
        <span class="btn btn-ghost btn-sm">兑换记录</span>
      </div>

      <div class="card row gap-12">
        <div class="thumb" style="width:70px;height:70px;">💰</div>
        <div class="flex-1">
          <div class="row-between"><div class="title" style="font-size:15px;">1元赠金</div><div class="tag">赠金</div></div>
          <div class="sub">300记分牌兑换1元赠金</div>
          <div class="sub">到账赠金 ¥1.00</div>
          <div class="row-between" style="margin-top:10px;">
            <div class="price">300 记分牌</div>
            <span class="btn btn-primary btn-sm">立即兑换</span>
          </div>
        </div>
      </div>

      <div class="card row gap-12">
        <div class="thumb" style="width:70px;height:70px;">🍺</div>
        <div class="flex-1">
          <div class="row-between"><div class="title" style="font-size:15px;">精酿啤酒一扎</div><div class="tag gray">实物</div></div>
          <div class="sub">凭兑换码到吧台核销</div>
          <div class="sub">剩余 50 份</div>
          <div class="row-between" style="margin-top:10px;">
            <div class="price">2000 记分牌</div>
            <span class="btn disabled" style="background:#333;color:var(--text-sub);">记分牌不足</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
