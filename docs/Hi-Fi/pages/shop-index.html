<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>点单 · 六六弗尔豪斯</title>
<link rel="stylesheet" href="../assets/style.css" />
<style>
  .shop-body { flex: 1; display: flex; overflow: hidden; }
  .side { width: 92px; background: #171717; overflow-y: auto; flex: none; }
  .side-item { padding: 16px 8px; text-align: center; font-size: 12px; color: var(--text-sub); line-height: 16px; }
  .list { flex: 1; overflow-y: auto; padding: 12px; }
  .goods { display: flex; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .goods-info { flex: 1; margin-left: 12px; display: flex; flex-direction: column; }
  .goods-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .goods-bottom { margin-top: auto; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn { width: 22px; height: 22px; line-height: 21px; text-align: center; border-radius: 50%; background: #3a3a3a; color: var(--text); font-size: 13px; }
  .footer-bar .cart-btn { padding: 0 24px; height: 34px; line-height: 34px; border-radius: 999px; background: #d2574f; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body class="screen-body">
  <div class="screen-root">
    <div class="statusbar"><span>9:41</span><span>●●● 5G 100%</span></div>

    <div class="shop-header">
      <div class="shop-logo">66</div>
      <div class="shop-name flex-1">六六弗尔豪斯休闲酒馆</div>
      <div class="shop-hours">营业时间：18:00-04:00</div>
    </div>

    <div class="shop-body">
      <div class="side">
        <div class="side-item active">威士忌</div>
        <div class="side-item">无酒精特调</div>
        <div class="side-item">啤酒</div>
        <div class="side-item">主食小吃</div>
      </div>

      <div class="list">
        <div class="goods">
          <div class="thumb" style="width:64px;height:64px;">🥃</div>
          <div class="goods-info">
            <div class="goods-name">山崎12年</div>
            <div class="sub">单杯 30ml，烟熏尾韵，木桶陈酿</div>
            <div class="row-between goods-bottom">
              <div class="price">¥128</div>
              <div class="stepper"><span class="step-btn">－</span><span>1</span><span class="step-btn">＋</span></div>
            </div>
          </div>
        </div>
        <div class="goods">
          <div class="thumb" style="width:64px;height:64px;">🥃</div>
          <div class="goods-info">
            <div class="goods-name">麦卡伦12年</div>
            <div class="sub">整瓶 700ml</div>
            <div class="row-between goods-bottom">
              <div class="price">¥980</div>
              <div class="stepper"><span class="step-btn">－</span><span>2</span><span class="step-btn">＋</span></div>
            </div>
          </div>
        </div>
        <div class="goods">
          <div class="thumb" style="width:64px;height:64px;">🍺</div>
          <div class="goods-info">
            <div class="goods-name">德式小麦</div>
            <div class="sub">500ml</div>
            <div class="row-between goods-bottom">
              <div class="price">¥38</div>
              <div class="stepper"><span class="step-btn">＋</span></div>
            </div>
          </div>
        </div>
        <div class="goods">
          <div class="thumb" style="width:64px;height:64px;">🍗</div>
          <div class="goods-info">
            <div class="goods-name">香辣鸡翅</div>
            <div class="sub">6只</div>
            <div class="row-between goods-bottom">
              <div class="price">¥36</div>
              <div class="stepper"><span class="step-btn">－</span><span>1</span><span class="step-btn">＋</span></div>
            </div>
          </div>
        </div>
        <div class="goods">
          <div class="thumb" style="width:64px;height:64px;">🍇</div>
          <div class="goods-info">
            <div class="goods-name">果盘拼盘</div>
            <div class="sub">不支持赠金支付</div>
            <div class="row-between goods-bottom">
              <div class="price">¥88</div>
              <div class="stepper"><span class="step-btn">＋</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="flex-1">
        <div class="price">¥256.00</div>
        <div class="sub">共4件</div>
      </div>
      <a class="cart-btn" href="shop-checkout.html">去结算</a>
    </div>
  </div>
</body>
</html>
